core_summary:
  professional_summary: >
    Creador de software apasionado por investigar, conectar ideas y resolver rompecabezas dificiles. 
    Mi mayor motivacion es explorar temas de inteligencia artificial y optimizacion matematica para desarrollar soluciones modernas. 
    Tengo experiencia asumiendo proyectos de principio a fin usando herramientas diversas. Me caracterizan mis valores, 
    mi interes por aprender e investigar cosas nuevas y aportar soluciones creativas al equipo.
  strengths:
    - Desarrollo full stack y arquitectura con ownership absoluto (End-to-End).
    - Reducción de cuellos de botella operativos (historial de mejoras del >50%).
    - Backend de alto rendimiento en Python con FastAPI.
    - Diseño y operación de bases de datos PostgreSQL y SQL.
    - Despliegue y mantenimiento autónomo en AWS sobre Linux/Ubuntu.
    - Base académica fuerte (M.C.) orientada a optimización, IA y análisis de datos.
    - Autonomía, empatía, curiosidad investigativa y mentalidad orientada a la colaboración.

